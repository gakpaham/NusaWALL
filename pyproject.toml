[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nusawall"
version = "0.1.0"
description = "NusaWall local market analytics for IDX and US equities"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.23",
  "pandas>=2.0",
  "pydantic>=2.0",
  "pytest>=8.0",
  "yfinance>=0.2.50"
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
nusawall = ["web/static/*"]

[tool.setuptools.packages.find]
include = ["nusawall*"]
